services:
  - type: web
    name: lms-server
    runtime: node
    rootDir: server
    buildCommand: npm install && cd ../client && npm install --include=dev && npm run build && test -f dist/index.html && mkdir -p ../server/public && cp -R dist/. ../server/public/
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
